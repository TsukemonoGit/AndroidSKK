plugins {
    id 'com.android.application'
}

android {
    compileSdk = 36

    defaultConfig {
        applicationId "jp.deadend.noname.skk"
        minSdkVersion 30
        versionCode 75
        versionName "3.7.26"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // -PverboseLog=true の debug ビルドでのみ、高頻度の状態ログを出す。
        def verboseLog = (project.findProperty("verboseLog") ?: "false").toString().toBoolean()
        buildConfigField "boolean", "VERBOSE_LOG", verboseLog.toString()
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    lint {
        // 新規の lint エラーでビルドを止める。
        // 依存ライブラリの更新通知など警告だけでは止まらない。
        abortOnError = true
    }
    namespace = 'jp.deadend.noname.skk'

    java {
        toolchain {
            languageVersion.set(JavaLanguageVersion.of(21))
        }
    }

    testOptions {
        unitTests {
            // Android API 呼び出しを既定値で返す。純粋ロジックのテストを軽く保つため。
            // Android 依存の挙動は Robolectric のテストで明示的に検証する。
            returnDefaultValues = true
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'org.apache.directory.jdbm:apacheds-jdbm1:2.0.0-M3'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.emoji2:emoji2-emojipicker:1.5.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    testImplementation 'androidx.test.ext:junit-ktx:1.3.0'
    testImplementation 'androidx.test:core-ktx:1.7.0'
    testImplementation 'org.robolectric:robolectric:4.18.1'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.ext:junit-ktx:1.3.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation 'junit:junit:4.13.2'
}
repositories {
    mavenCentral()
}
